<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Зелёный Урожай — Сити-ферма микрозелени</title>
    <!-- Telegram WebApp JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Шапка витрины -->
        <header class="header">
            <div class="logo-container">
                <span class="logo-icon">🌱</span>
                <div>
                    <h1 class="title">Зелёный Урожай</h1>
                    <p class="subtitle">Свежая микрозелень с эко-фермы</p>
                </div>
            </div>
        </header>

        <!-- Вкладка 1: КАТАЛОГ -->
        <section id="tab-catalog" class="tab-content active">
            <!-- Навигация по категориям -->
            <nav class="categories">
                <button class="cat-btn active" data-category="all">Все товары</button>
                <button class="cat-btn" data-category="live_trays">🌱 Живые лотки</button>
                <button class="cat-btn" data-category="cut_greens">✂️ Срезка</button>
                <button class="cat-btn" data-category="sets">🎁 Наборы</button>
            </nav>

            <!-- Сетка товаров -->
            <main class="catalog" id="catalog-container">
                <!-- Карточки товаров генерируются через JS -->
            </main>
        </section>

        <!-- Вкладка 2: КОРЗИНА -->
        <section id="tab-cart" class="tab-content hidden">
            <div class="cart-section">
                <h2 class="section-title">🛒 Ваша корзина</h2>
                <div id="cart-items-container" class="cart-items">
                    <!-- Содержимое корзины -->
                </div>
                <div id="cart-total-box" class="cart-total-box hidden">
                    <div class="total-row">
                        <span>Итого к оплате:</span>
                        <strong id="cart-page-total">0 ₽</strong>
                    </div>
                    <button class="btn-success" id="btn-cart-checkout">📦 Перейти к оформлению</button>
                </div>
            </div>
        </section>

        <!-- Вкладка 3: ЛИЧНЫЙ КАБИНЕТ (ПРОФИЛЬ) -->
        <section id="tab-profile" class="tab-content hidden">
            <div class="profile-card">
                <div class="avatar-container">
                    <img id="user-avatar" src="https://ui-avatars.com/api/?name=User&background=2e7d32&color=fff&size=128" alt="Аватар" class="user-avatar">
                </div>
                <h2 id="user-full-name" class="user-name">Покупатель</h2>
                <p id="user-username" class="user-handle">@telegram_user</p>
                <span class="status-badge">🌱 Эко-Ценитель микрозелени</span>
            </div>

            <div class="profile-section">
                <h3>📍 Сохраненные данные доставки</h3>
                <div class="saved-info-box">
                    <p>📱 <strong>Телефон:</strong> <span id="saved-phone">Не указан</span></p>
                    <p>🏠 <strong>Адрес:</strong> <span id="saved-address">Не указан</span></p>
                </div>
            </div>

            <div class="profile-section">
                <h3>📜 Ваша статистика покупок</h3>
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-num" id="stat-orders-count">0</span>
                        <span class="stat-label">Заказов</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-num" id="stat-trays-count">0</span>
                        <span class="stat-label">Лотков зелени</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Модальное окно оформления заказа -->
        <div class="modal hidden" id="checkout-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>📦 Оформление заказа</h2>
                    <button class="btn-close" id="btn-close-modal">✕</button>
                </div>
                
                <form id="order-form">
                    <div class="form-group">
                        <label>👤 Ваше имя и фамилия:</label>
                        <input type="text" id="cust-name" placeholder="Иван Иванов" required>
                    </div>

                    <div class="form-group">
                        <label>📱 Телефон для связи:</label>
                        <input type="tel" id="cust-phone" placeholder="+7 (900) 000-00-00" required>
                    </div>

                    <div class="form-group">
                        <label>🚚 Способ получения:</label>
                        <select id="del-type">
                            <option value="🚚 Доставка курьером">🚚 Доставка курьером по городу</option>
                            <option value="🏃 Самовывоз">🏃 Самовывоз из фермы (ул. Зеленая, 15)</option>
                        </select>
                    </div>

                    <div class="form-group" id="address-group">
                        <label>📍 Адрес доставки:</label>
                        <input type="text" id="cust-address" placeholder="г. Москва, ул. Ленина, д. 10, кв. 5">
                    </div>

                    <div class="form-group">
                        <label>📅 Желаемая дата и время получения:</label>
                        <input type="text" id="del-date" placeholder="Завтра к 14:00" required>
                    </div>

                    <div class="form-group">
                        <label>💳 Способ оплаты:</label>
                        <select id="pay-method">
                            <option value="💵 При получении">💵 При получении (наличные/карта)</option>
                            <option value="💳 Перевод по реквизитам">💳 Перевод по реквизитам (СБП/Карта)</option>
                            <option value="⚡ Онлайн-оплата">⚡ Онлайн-оплата в боте</option>
                        </select>
                    </div>

                    <div class="order-summary" id="modal-summary"></div>

                    <button type="submit" class="btn-success" id="btn-submit-order">🎉 Подтвердить и отправить заказ</button>
                </form>
            </div>
        </div>

        <!-- Нижняя навигационная панель (Bottom Nav) -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="tab-catalog">
                <span class="nav-icon">🛍</span>
                <span class="nav-label">Каталог</span>
            </button>
            <button class="nav-item" data-tab="tab-cart">
                <span class="nav-icon">🛒</span>
                <span class="nav-label">Корзина</span>
                <span class="nav-badge hidden" id="nav-cart-badge">0</span>
            </button>
            <button class="nav-item" data-tab="tab-profile">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Профиль</span>
            </button>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
